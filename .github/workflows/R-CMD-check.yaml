# Multi-platform R CMD check, running on the GitHub mirror.
#
# The canonical Gitea CI (.gitea/workflows/R-CMD-check.yaml) only runs on
# Linux. fbi's hard Imports (httr, jsonlite) are pure R with no compiled
# toolchain, but the optional geography features
# (add_place_spatial_members()) pull sf and tigris from Suggests, and sf's
# GDAL/GEOS/PROJ dependency chain is exactly the kind of thing that behaves
# differently across Windows/macOS/Linux. This package targets CRAN, where
# that variance gets caught either way -- better to catch it here first.
#
# Gitea reads .gitea/workflows and GitHub reads .github/workflows, so this
# file is inert on the canonical repo and coexists with the Gitea CI that
# remains authoritative for deploys.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_FORCE_SUGGESTS_: false
      # Live CDE API tests are opt-in (FBI_CDE_LIVE=true) and run in the
      # scheduled live-api workflow, not here.
      _R_CHECK_TESTS_NLINES_: 0

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
