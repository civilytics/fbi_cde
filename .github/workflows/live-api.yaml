# Weekly check against the real CDE API.
#
# The offline suite mocks cde_request() with recorded fixtures, so it cannot
# notice when the CDE changes a response shape -- which it has done several
# times without notice. This runs the suite with FBI_CDE_LIVE=true, which
# switches on every skip_if_no_fbi_api()-guarded live test. A red run here
# usually means upstream drift or an outage, not a broken commit: compare the
# failing endpoint's live response with its fixture in tests/testthat/fixtures.
#
# Scheduled workflows run only on the default branch, and GitHub pauses them
# after 60 days without repository activity.
name: live-api

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FBI_CDE_LIVE: "true"
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Hard dependencies only: the sf/tigris/censusapi paths are not live CDE
      # calls, and their tests skip when those packages are absent.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::testthat, any::withr

      - name: Run the test suite with live tests enabled
        run: testthat::test_local(reporter = "summary")
        shell: Rscript {0}
